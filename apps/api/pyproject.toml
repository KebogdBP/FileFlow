[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fileflow-api"
version = "0.1.0"
description = "Privacy-first FileFlow backend API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.5",
  "boto3==1.43.51",
  "fastapi==0.139.2",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.7.0",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff==0.15.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fileflow_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fileflow_api"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3", "botocore.client"]
ignore_missing_imports = true
