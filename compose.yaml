services:
  postgres:
    image: postgres:17-alpine
    profiles: ['backend']
    environment: { POSTGRES_DB: fileflow, POSTGRES_USER: fileflow, POSTGRES_PASSWORD: fileflow }
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fileflow']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    profiles: ['backend']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    profiles: ['backend']
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: fileflow, MINIO_ROOT_PASSWORD: fileflow-local-only }
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio_data:/data']
  minio-init:
    image: minio/mc:latest
    profiles: ['backend']
    depends_on: [minio]
    entrypoint: ['/bin/sh', '-c']
    command:
      [
        'until mc alias set local http://minio:9000 fileflow fileflow-local-only; do sleep 2; done; mc mb --ignore-existing local/fileflow-temporary',
      ]
  clamav:
    image: clamav/clamav:1.4_base
    profiles: ['backend']
    ports: ['3310:3310']
    volumes: ['clamav_signatures:/var/lib/clamav']
  api:
    build:
      context: .
      dockerfile: apps/media-worker/Dockerfile
    profiles: ['backend']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      clamav: { condition: service_started }
    command:
      [
        '/bin/sh',
        '-c',
        'alembic upgrade head && uvicorn fileflow_api.main:app --host 0.0.0.0 --port 8000',
      ]
    environment: &api_environment
      FILEFLOW_DATABASE_URL: postgresql+psycopg://fileflow:fileflow@postgres:5432/fileflow
      FILEFLOW_REDIS_URL: redis://redis:6379/0
      FILEFLOW_S3_ENDPOINT_URL: http://minio:9000
      FILEFLOW_S3_ACCESS_KEY: fileflow
      FILEFLOW_S3_SECRET_KEY: fileflow-local-only
      FILEFLOW_S3_BUCKET: fileflow-temporary
      FILEFLOW_MALWARE_SCANNER_HOST: clamav
      FILEFLOW_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      FILEFLOW_TRUSTED_HOSTS: '["localhost","127.0.0.1","api"]'
    ports: ['8000:8000']
  safety-worker:
    build:
      context: .
      dockerfile: apps/media-worker/Dockerfile
    profiles: ['backend']
    depends_on: [api]
    command:
      [
        'celery',
        '-A',
        'fileflow_api.jobs.worker:celery_app',
        'worker',
        '--queues',
        'safety',
        '--loglevel',
        'INFO',
      ]
    environment: *api_environment
  processing-worker:
    build:
      context: .
      dockerfile: apps/media-worker/Dockerfile
    profiles: ['backend']
    depends_on: [api]
    command:
      [
        'celery',
        '-A',
        'fileflow_api.jobs.worker:celery_app',
        'worker',
        '--queues',
        'processing,imports',
        '--loglevel',
        'INFO',
      ]
    environment: *api_environment
volumes: { postgres_data: {}, minio_data: {}, clamav_signatures: {} }
