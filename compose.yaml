services:
  postgres:
    image: postgres:17-alpine
    profiles: ['backend']
    environment: { POSTGRES_DB: fileflow, POSTGRES_USER: fileflow, POSTGRES_PASSWORD: fileflow }
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
  redis:
    image: redis:8-alpine
    profiles: ['backend']
    ports: ['6379:6379']
  minio:
    image: minio/minio:latest
    profiles: ['backend']
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: fileflow, MINIO_ROOT_PASSWORD: fileflow-local-only }
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio_data:/data']
  clamav:
    image: clamav/clamav:1.4_base
    profiles: ['backend']
    ports: ['3310:3310']
    volumes: ['clamav_signatures:/var/lib/clamav']
volumes: { postgres_data: {}, minio_data: {}, clamav_signatures: {} }
